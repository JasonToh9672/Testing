<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Food Explorer - Contact</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e74c3c;
            --secondary-color: #f39c12;
            --accent-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9f9f9;
        }

        .navbar {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .navbar a {
            color: white !important;
            font-weight: 600;
        }

        .hero {
            padding: 60px 0;
            text-align: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .hero h1 {
            font-size: 2.5rem;
        }

        .contact-form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .social-links a {
            font-size: 1.8rem;
            margin: 0 10px;
            color: var(--secondary-color);
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: var(--primary-color);
        }

        .footer {
            background: #2c3e50;
            color: white;
            padding: 30px 0;
            margin-top: 40px;
        }

        .footer a {
            color: #f39c12;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">Street Food Explorer</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="navMenu" class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="malaysia.html" class="nav-link">Malaysia</a></li>
                    <li class="nav-item"><a href="global.html" class="nav-link">Global</a></li>
                    <li class="nav-item"><a href="gallery.html" class="nav-link">Gallery</a></li>
                    <li class="nav-item"><a href="map.html" class="nav-link">Map</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link active">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div class="container">
            <h1>📩 Contact Us</h1>
            <p class="lead">We’d love to hear from you! Share your feedback or say hello.</p>
        </div>
    </section>

    <!-- Contact Form -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="contact-form">
                    <h3 class="mb-4">Send us a message</h3>
                    <form id="contactForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Your Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Your Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100"><i class="fas fa-paper-plane"></i>
                            Send</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Social Media -->
        <div class="text-center mt-5">
            <h4>Follow Us</h4>
            <div class="social-links">
                <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://youtube.com" target="_blank"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer text-center">
        <p>&copy; 2025 Street Food Explorer | All Rights Reserved</p>
        <p><a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            // Load saved form data
            const savedData = JSON.parse(localStorage.getItem("contactFormData") || "{}");
            if (savedData.name) $("#name").val(savedData.name);
            if (savedData.email) $("#email").val(savedData.email);
            if (savedData.message) $("#message").val(savedData.message);

            // Save data on input
            $("#name, #email, #message").on("input", function () {
                const formData = {
                    name: $("#name").val(),
                    email: $("#email").val(),
                    message: $("#message").val()
                };
                localStorage.setItem("contactFormData", JSON.stringify(formData));
            });

            // Submit handler
            $("#contactForm").on("submit", function (e) {
                e.preventDefault();
                alert("Thank you for contacting us, " + $("#name").val() + "! Your message has been saved.");
            });
        });
    </script>
</body>

</html>
